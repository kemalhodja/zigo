<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7C3AED" />
    <title>Zigo — Çevrimdışı</title>
    <style>
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 16% 0%, rgb(236 72 153 / 0.22), transparent 18rem),
          radial-gradient(circle at 86% 10%, rgb(6 182 212 / 0.18), transparent 18rem),
          linear-gradient(180deg, #fff7fb, #f8fbff);
        color: #101828;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(22rem, calc(100% - 2rem));
        text-align: center;
      }
      .logo {
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1rem;
        display: grid;
        place-items: center;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #7c3aed, #ec4899, #06b6d4);
        color: white;
        font-size: 2rem;
        font-weight: 900;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      p {
        margin: 0.6rem 0 0;
        color: #667085;
        line-height: 1.6;
      }
      .hint {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 0.9rem;
        background: #ffffffcc;
        border: 1px solid #eef0f4;
        font-size: 0.85rem;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.8rem 2.2rem;
        border: 0;
        border-radius: 0.9rem;
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        color: white;
        font-size: 0.95rem;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Z</div>
      <h1>Şu anda çevrimdışısın 📴</h1>
      <p>Son yüklediğin akış ve oyunlar kayıtlı — onlara erişmeye devam edebilirsin.</p>
      <div class="hint">
        Bağlantın döndüğünde akış otomatik güncellenir. Oyunlar tamamen çevrimdışı çalışır!
      </div>
      <button onclick="location.reload()">Yeniden Dene</button>
    </main>
  </body>
</html>
