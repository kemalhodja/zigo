<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bağlantı Hatası - Zigo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      color: #dc3545;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      font-size: 16px;
      color: #6c757d;
      margin-bottom: 30px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      color: #fff;
      background-color: #0d6efd;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>
  <div class="icon">🌐</div>
  <h1>Bağlantı Kurulamadı</h1>
  <p>Sunucuyla iletişim kurulurken bir hata oluştu. Lütfen internet bağlantınızı kontrol edip tekrar deneyin.</p>
  <button onclick="window.location.reload()">Tekrar Dene</button>
</body>
</html>
