name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC for security scans
    - cron: '0 3 * * 1'  # Weekly on Monday 3 AM for performance tests

env:
  NODE_VERSION: '22.x'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ============================================================
  # QUALITY GATES (run on every PR/push)
  # ============================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Audit: TypeScript strict
        run: npm run audit:typescript

      - name: Audit: Security (auth, CORS, env leak, service-role, RLS)
        run: npm run audit:security

      - name: Audit: Moderation pipeline
        run: node scripts/moderation-pipeline-audit.mjs

      - name: Audit: Product scope
        run: npm run audit:product-scope

      - name: Unit tests
        run: npm run test:unit

      - name: Unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Accessibility audit
        run: npm run audit:accessibility

      - name: Visual regression check
        run: npm run test:visual

  # ============================================================
  # FULL AUDIT SUITE (run on main/develop pushes)
  # ============================================================
  full-audit:
    name: Full Audit Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    needs: quality-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all audits
        run: npm run audit:all

      - name: Build verification
        run: npm run build:safe

      - name: Full test suite (test:repo)
        run: npm run test:repo

  # ============================================================
  # E2E TESTS (run on main/develop pushes)
  # ============================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    needs: quality-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build:safe

      - name: Start preview server
        run: |
          npm run start &
          sleep 15

      - name: Run E2E tests (critical paths)
        run: npm run test:playwright -- --project=chromium

      - name: Run Visual Regression tests
        run: npm run test:playwright -- --project=chromium --grep "Visual Regression"

      - name: Run Accessibility tests
        run: npm run test:playwright -- --project=chromium --grep "Accessibility"

      - name: Run Mobile tests
        run: npm run test:playwright -- --project=mobile-chrome --grep "Mobile"

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Upload visual regression screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: test-results/
          retention-days: 7

  # ============================================================
  # PERFORMANCE TESTS (scheduled + manual)
  # ============================================================
  performance-tests:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup k6
        uses: grafana/k6-action@v0.2.0
        with:
          version: 'latest'

      - name: Run load test (smoke)
        run: k6 run e2e/load-test.js --env BASE_URL=https://staging.zigo.app

      - name: Run load test (stress)
        if: github.event_name == 'workflow_dispatch'
        run: k6 run e2e/load-test.js --env BASE_URL=https://staging.zigo.app --duration 5m --vus 500

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: k6-results/
          retention-days: 7

  # ============================================================
  # SECURITY SCANS
  # ============================================================
  security-scan:
    name: Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'https://staging.zigo.app'
          cmd_options: '-a'

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
          retention-days: 7

  # ============================================================
  # DEPLOY STAGING (on develop push or manual)
  # ============================================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [full-audit, e2e-tests]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.zigo.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:safe

      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Run staging smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: https://staging.zigo.app

      - name: Run staging visual regression
        run: npm run test:visual
        env:
          BASE_URL: https://staging.zigo.app

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
          fi

  # ============================================================
  # DEPLOY PRODUCTION (on main push with tag or manual)
  # ============================================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [full-audit, e2e-tests]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && startsWith(github.event.head_commit.message, 'release:')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://zigo.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:safe

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Android AAB to Play Console (Internal Testing)
        if: hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.zigo.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Run production smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: https://zigo.app

      - name: Run production visual regression
        run: npm run test:visual
        env:
          BASE_URL: https://zigo.app

      - name: Create GitHub Release
        if: startsWith(github.event.head_commit.message, 'release:')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Changes
            ${{ github.event.head_commit.message }}
            
            ## Deployment
            - Vercel: https://zigo.app
            - Android: Internal testing track
          draft: false
          prerelease: false

      - name: Notify deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment successful"
          else
            echo "❌ Production deployment failed"
          fi

  # ============================================================
  # HETZNER DEPLOY (manual trigger for self-hosted)
  # ============================================================
  deploy-hetzner:
    name: Deploy Hetzner (Self-Hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: hetzner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Hetzner
        run: node scripts/deploy-hetzner.mjs
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}

      - name: Verify deployment
        run: node scripts/verify-deploy-readiness.mjs
        env:
          BASE_URL: https://${{ secrets.HETZNER_DOMAIN }}

      - name: Run post-deploy smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: https://${{ secrets.HETZNER_DOMAIN }}